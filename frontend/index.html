<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robo — Voice Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    #status { color: #0f0; font-size: 1.4rem; margin-bottom: 1rem; }
    #transcript { color: #ff0; margin: 0.5rem 0; }
    #response { color: #0ff; margin: 0.5rem 0; }
    button { padding: 1rem 2rem; font-size: 1.2rem; cursor: pointer; }

    /* PTT button states */
    #ptt-btn {
      display: none;
      padding: 1.2rem 2.4rem;
      font-size: 1.3rem;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid #555;
      background: #222;
      color: #eee;
      transition: background 0.15s, border-color 0.15s;
      margin-top: 0.8rem;
    }
    #ptt-btn.idle {
      border-color: #0a0;
      color: #0f0;
    }
    #ptt-btn.recording {
      border-color: #f80;
      color: #f80;
      background: #221a00;
      animation: pulse 0.9s ease-in-out infinite;
    }
    #ptt-btn.busy {
      border-color: #555;
      color: #888;
      cursor: not-allowed;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    /* Check-in status badges */
    #badges { margin-top: 1rem; }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      margin: 0.2rem;
      border-radius: 1rem;
      background: #333;
      color: #888;
      font-size: 0.9rem;
      transition: background 0.3s, color 0.3s;
    }
    .badge.active {
      background: #16a34a;
      color: white;
    }
  </style>
</head>
<body>
  <div id="status">Disconnected</div>
  <div id="transcript">Transcript: —</div>
  <div id="response">Response: —</div>
  <div id="badges" style="margin-top: 1rem;">
    <span id="badge-checkin"  class="badge">☐ Checked In</span>
    <span id="badge-notified" class="badge">☐ Host Notified</span>
    <span id="badge-ack"      class="badge">☐ Host On Their Way</span>
  </div>
  <div id="debug" style="color:#888; font-size:0.85rem; margin-top:1rem; white-space:pre-wrap; max-height:200px; overflow-y:auto; border:1px solid #333; padding:0.5rem;"></div>
  <button id="btn">Connect &amp; Start</button>
  <button id="ptt-btn" class="idle">🎤 Tap to Speak</button>

  <script>
    const KIOSK_ID = "kiosk-01";
    const WS_URL = `ws://${window.location.host}/ws/voice/${KIOSK_ID}`;
    const MIC_SAMPLE_RATE = 16000;   // microphone capture & VAD rate
    const TTS_SAMPLE_RATE = 24000;   // Kokoro TTS output rate — MUST match tts.py SAMPLE_RATE

    let ws, audioCtx, mediaStream, workletNode;
    let playbackQueue = [];
    let isPlaying = false;
    let connected = false;

    // ── PTT state ─────────────────────────────────────────────────────────────
    // "idle"      — ready to record (tap to activate)
    // "recording" — actively forwarding PCM chunks to the backend
    // "busy"      — backend is processing / speaking; button is locked
    let pttState = "idle";

    const statusEl    = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const responseEl  = document.getElementById("response");
    const debugEl     = document.getElementById("debug");
    const btnEl       = document.getElementById("btn");
    const pttEl       = document.getElementById("ptt-btn");

    function log(msg, type = "info") {
      const ts = new Date().toLocaleTimeString();
      const line = `[${ts}] ${type.toUpperCase()} | ${msg}`;
      console.log(line);
      const lines = (debugEl.textContent + "\n" + line).split("\n").slice(-20);
      debugEl.textContent = lines.join("\n");
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    log(`Frontend initialized. WebSocket URL: ${WS_URL}`);

    // ── Connect / disconnect button ───────────────────────────────────────────
    btnEl.onclick = async () => {
      if (connected) {
        disconnect();
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = "Connecting...";
      try {
        await connect();
        connected = true;
        btnEl.disabled = false;
        btnEl.textContent = "Disconnect";

        // Show PTT button once connected
        pttEl.style.display = "inline-block";
        setPttState("idle");
      } catch (err) {
        log(`Connection error: ${err.message}`, "error");
        statusEl.textContent = `Error: ${err.message}`;
        btnEl.disabled = false;
        btnEl.textContent = "Connect & Start";
      }
    };

    // ── PTT button ────────────────────────────────────────────────────────────
    pttEl.onclick = () => {
      if (!connected) return;

      if (pttState === "idle") {
        // Start a new recording session
        setPttState("recording");
        log("PTT: recording started — forwarding audio to backend");
      } else if (pttState === "recording") {
        // User taps again to cancel before VAD fires utterance complete
        setPttState("idle");
        log("PTT: recording cancelled by user");
      }
      // "busy" taps are ignored — button is visually disabled
    };

    function setPttState(state) {
      pttState = state;
      pttEl.className = state; // "idle" | "recording" | "busy"
      if (state === "idle") {
        pttEl.textContent = "🎤 Tap to Speak";
        pttEl.disabled = false;
      } else if (state === "recording") {
        pttEl.textContent = "🔴 Listening…  (tap to cancel)";
        pttEl.disabled = false;
      } else {
        pttEl.textContent = "⏳ Processing…";
        pttEl.disabled = true;
      }
    }

    // ── Badge helpers ─────────────────────────────────────────────────────────
    function setBadge(id, active) {
      const el = document.getElementById(id);
      if (active) el.classList.add("active");
      else el.classList.remove("active");
    }

    function resetBadges() {
      ["badge-checkin", "badge-notified", "badge-ack"].forEach(id => {
        document.getElementById(id).classList.remove("active");
      });
    }

    function disconnect() {
      log("Disconnecting...");
      if (ws) ws.close();
      cleanup();
    }

    function cleanup() {
      connected = false;
      pttEl.style.display = "none";
      setPttState("idle");
      resetBadges();
      if (workletNode) { workletNode.disconnect(); workletNode = null; }
      if (audioCtx)    { audioCtx.close();         audioCtx = null;    }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      playbackQueue = [];
      isPlaying = false;
      btnEl.disabled = false;
      btnEl.textContent = "Connect & Start";
      statusEl.textContent = "Disconnected";
    }

    async function connect() {
      log("Starting connection flow...");
      resetBadges();

      // ── Audio context ─────────────────────────────────────
      audioCtx = new AudioContext({ sampleRate: MIC_SAMPLE_RATE });
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }
      log(`✓ AudioContext created (sample rate: ${audioCtx.sampleRate})`);

      // ── Microphone ────────────────────────────────────────
      log("Requesting microphone permission...");
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            sampleRate: MIC_SAMPLE_RATE,
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
          }
        });
        log("✓ Microphone permission granted");
      } catch (err) {
        throw new Error(`Microphone permission denied: ${err.message}`);
      }

      const source = audioCtx.createMediaStreamSource(mediaStream);
      log("✓ Media stream source created");

      // ── AudioWorklet ──────────────────────────────────────
      log("Loading AudioWorklet...");
      try {
        await audioCtx.audioWorklet.addModule("/static/worklet.js");
        log("✓ AudioWorklet loaded");
      } catch (err) {
        throw new Error(`AudioWorklet load failed: ${err.message}`);
      }

      workletNode = new AudioWorkletNode(audioCtx, "pcm-capture");
      source.connect(workletNode);
      // Do NOT connect workletNode to destination — no mic playback.
      log("✓ AudioWorklet graph connected");

      // Debug counters
      let chunkCount = 0;
      let bytesSent = 0;

      // ── WebSocket ─────────────────────────────────────────
      log(`Connecting to WebSocket: ${WS_URL}`);
      ws = new WebSocket(WS_URL);
      ws.binaryType = "arraybuffer";

      // ── PTT gate: only forward chunks when pttState === "recording" ──────
      // The worklet runs continuously so the AudioContext/graph stays warm and
      // avoids any startup latency. Chunks are simply discarded when not recording.
      workletNode.port.onmessage = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN && pttState === "recording") {
          ws.send(e.data);
          chunkCount++;
          bytesSent += e.data.byteLength;
          if (chunkCount === 1) {
            log(`First PTT PCM chunk sent: ${e.data.byteLength} bytes (sampleRate=${audioCtx.sampleRate})`);
          }
          if (chunkCount % 100 === 0) {
            log(`PCM chunks sent: ${chunkCount}, total bytes: ${bytesSent}`);
          }
        }
      };

      ws.onmessage = async (event) => {
        if (typeof event.data === "string") {
          const msg = JSON.parse(event.data);
          log(`← ${msg.type}${msg.state ? ": " + msg.state : ""}`, "debug");
          handleControl(msg);
        } else {
          playbackQueue.push(event.data);
          if (!isPlaying) playNext();
        }
      };

      ws.onclose = () => {
        log("WebSocket closed");
        cleanup();
      };

      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          reject(new Error("WebSocket connection timeout (5s)"));
        }, 5000);

        ws.onopen = () => {
          clearTimeout(timeout);
          log("✓ WebSocket open");
          statusEl.textContent = "Connected — tap to speak";
          ws.onerror = (err) => {
            log(`WebSocket error: ${err}`, "error");
            statusEl.textContent = "Error — check console";
          };
          resolve();
        };

        ws.onerror = (err) => {
          clearTimeout(timeout);
          log(`WebSocket connection failed: ${err}`, "error");
          reject(new Error("WebSocket connection failed"));
        };
      });
    }

    function handleControl(msg) {
      if (msg.type === "state") {
        statusEl.textContent = `State: ${msg.state}`;

        if (msg.state === "listening") {
          // VAD picked up speech — show the user we're actively capturing
          if (pttState === "recording") {
            pttEl.textContent = "🔴 Listening…  (tap to cancel)";
          }
        } else if (msg.state === "thinking" || msg.state === "speaking") {
          // Utterance has been handed off — stop forwarding audio and lock the button
          // until the full response cycle completes (audio_end → idle)
          if (pttState === "recording") {
            setPttState("busy");
            log("PTT: utterance captured — backend processing");
          }
        } else if (msg.state === "idle") {
          // Backend is back to idle (after speaking or empty STT result)
          // Only re-enable the button if it was in busy state (not if user cancelled)
          if (pttState === "busy") {
            setPttState("idle");
            log("PTT: ready for next utterance");
          }
        }

      } else if (msg.type === "transcript") {
        transcriptEl.textContent = `Transcript: ${msg.text}`;
      } else if (msg.type === "response") {
        responseEl.textContent = `Response: ${msg.text}`;
      } else if (msg.type === "ui_update") {
        if (msg.event === "checkin_complete") {
          setBadge("badge-checkin", true);
          log("Badge: checked in ✓");
        } else if (msg.event === "notification_sent") {
          setBadge("badge-notified", true);
          log(`Badge: host notified — ${msg.host_name}`);
        } else if (msg.event === "host_acknowledged") {
          setBadge("badge-ack", true);
          responseEl.textContent = `${msg.host_name} is on their way to meet you.`;
          log("Host acknowledged: " + JSON.stringify(msg));
        }
      } else if (msg.type === "audio_end") {
        // audio_end is sent right before the final "idle" state — nothing extra needed,
        // the state === "idle" handler above covers the reset.
        log("PTT: audio playback complete");
      }
    }

    async function playNext() {
      if (playbackQueue.length === 0) { isPlaying = false; return; }
      isPlaying = true;

      const arrayBuffer = playbackQueue.shift();
      const int16   = new Int16Array(arrayBuffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) {
        float32[i] = int16[i] / 32768.0;
      }

      // TTS audio is 24kHz — must match Kokoro's output rate, NOT the mic capture rate.
      // Passing the wrong rate here causes pitch/speed distortion (e.g. 16kHz → 1.5× slower, deeper voice).
      const audioBuffer = audioCtx.createBuffer(1, float32.length, TTS_SAMPLE_RATE);
      audioBuffer.copyToChannel(float32, 0);

      const src = audioCtx.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(audioCtx.destination);
      src.onended = playNext;
      src.start();
    }
  </script>
</body>
</html>
