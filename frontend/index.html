<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robo — Reception Assistant</title>
  <style>
    /* ── Base ─────────────────────────────────────────────────────────────── */
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; max-width: 860px; }
    #status { color: #0f0; font-size: 1.4rem; margin-bottom: 1rem; }
    #transcript { color: #ff0; margin: 0.5rem 0; }
    #response { color: #0ff; margin: 0.5rem 0; }
    button { padding: 1rem 2rem; font-size: 1.2rem; cursor: pointer; }

    /* ── PTT button states ────────────────────────────────────────────────── */
    #ptt-btn {
      display: none;
      padding: 1.2rem 2.4rem;
      font-size: 1.3rem;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid #555;
      background: #222;
      color: #eee;
      transition: background 0.15s, border-color 0.15s;
      margin-top: 0.8rem;
    }
    #ptt-btn.idle    { border-color: #0a0; color: #0f0; }
    #ptt-btn.recording {
      border-color: #f80; color: #f80; background: #221a00;
      animation: pulse 0.9s ease-in-out infinite;
    }
    #ptt-btn.busy    { border-color: #555; color: #888; cursor: not-allowed; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* ── Check-in status badges ───────────────────────────────────────────── */
    #badges { margin-top: 1rem; }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      margin: 0.2rem;
      border-radius: 1rem;
      background: #333;
      color: #888;
      font-size: 0.9rem;
      transition: background 0.3s, color 0.3s;
    }
    .badge.active { background: #16a34a; color: white; }

    /* ── Chat panel ───────────────────────────────────────────────────────── */
    #chat-section {
      margin-top: 2rem;
      border-top: 1px solid #333;
      padding-top: 1rem;
    }
    #chat-section h2 {
      color: #0f0;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    #chat-panel {
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
    }
    #chat-history {
      height: 220px;
      overflow-y: auto;
      background: #0a0a0a;
      padding: 0.6rem 0.75rem;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      scroll-behavior: smooth;
    }
    #chat-history .msg { margin: 0.2rem 0; word-break: break-word; }
    #chat-history .msg.user      { color: #ff0; }
    #chat-history .msg.assistant { color: #0ff; }
    #chat-history .msg.error     { color: #f55; }
    #chat-history .msg.system    { color: #888; font-style: italic; }
    #chat-input-row {
      display: flex;
      border-top: 1px solid #333;
    }
    #chat-input {
      flex: 1;
      background: #1a1a1a;
      color: #eee;
      border: none;
      border-right: 1px solid #333;
      padding: 0.65rem 0.85rem;
      font-family: monospace;
      font-size: 1rem;
      outline: none;
    }
    #chat-input::placeholder { color: #555; }
    #chat-input:focus { background: #1e1e1e; }
    #chat-input:disabled { opacity: 0.45; cursor: not-allowed; }
    #chat-send {
      background: #1a1a1a;
      color: #0f0;
      border: none;
      padding: 0.65rem 1.2rem;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #chat-send:hover:not(:disabled) { background: #222; color: #3f3; }
    #chat-send:disabled { color: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <!-- ── Voice status / controls ─────────────────────────────────────────── -->
  <div id="status">Initialising…</div>
  <div id="transcript">Transcript: —</div>
  <div id="response">Response: —</div>

  <div id="badges" style="margin-top: 1rem;">
    <span id="badge-checkin"  class="badge">☐ Checked In</span>
    <span id="badge-notified" class="badge">☐ Host Notified</span>
    <span id="badge-ack"      class="badge">☐ Host On Their Way</span>
  </div>

  <div id="debug" style="color:#888; font-size:0.85rem; margin-top:1rem; white-space:pre-wrap; max-height:200px; overflow-y:auto; border:1px solid #333; padding:0.5rem;"></div>

  <div style="margin-top: 1rem;">
    <button id="btn">Connect &amp; Start Voice</button>
    <button id="ptt-btn" class="idle">🎤 Tap to Speak</button>
  </div>

  <!-- ── Chat panel ─────────────────────────────────────────────────────── -->
  <div id="chat-section">
    <h2>// Chat</h2>
    <div id="chat-panel">
      <div id="chat-history"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Type a message and press Enter…" disabled />
        <button id="chat-send" disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    const KIOSK_ID       = "kiosk-01";
    const MIC_SAMPLE_RATE = 16000;
    const TTS_SAMPLE_RATE = 24000;

    // ── Session UUID ─────────────────────────────────────────────────────────
    // Created at page load via POST /chat/{kiosk_id}/session.
    // Shared between the chat HTTP endpoint and the voice WebSocket so both
    // modalities read/write the same conversation history in Redis.
    let sessionUuid = null;

    let ws, audioCtx, mediaStream, workletNode;
    let playbackQueue = [];
    let isPlaying = false;
    let connected  = false;
    let pttState   = "idle";  // "idle" | "recording" | "busy"
    let eventSource = null;

    const statusEl    = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const responseEl  = document.getElementById("response");
    const debugEl     = document.getElementById("debug");
    const btnEl       = document.getElementById("btn");
    const pttEl       = document.getElementById("ptt-btn");
    const chatHistoryEl = document.getElementById("chat-history");
    const chatInputEl   = document.getElementById("chat-input");
    const chatSendEl    = document.getElementById("chat-send");

    // ── Logging ──────────────────────────────────────────────────────────────
    function log(msg, type = "info") {
      const ts   = new Date().toLocaleTimeString();
      const line = `[${ts}] ${type.toUpperCase()} | ${msg}`;
      console.log(line);
      const lines = (debugEl.textContent + "\n" + line).split("\n").slice(-20);
      debugEl.textContent = lines.join("\n");
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    // ── TTS playback for chat responses ─────────────────────────────────────
    // Uses the Fetch Streams API to start playing the first sentence while
    // the server is still synthesising the rest — matching voice WS latency.
    // When voice is disconnected a fresh AudioContext is created; when it's
    // active the same AudioContext is reused so sample rates stay consistent.

    let chatIsPlaying  = false;
    // Scheduled end-time of the last queued buffer (Web Audio clock seconds).
    // We schedule each decoded chunk to start exactly when the previous one
    // ends so there are no gaps between sentences.
    let chatScheduledUntil = 0;

    async function speakText(text) {
      if (!text || !text.trim()) return;

      // Resolve the AudioContext to use — reuse the voice one if available.
      let ctx = audioCtx;
      if (!ctx || ctx.state === "closed") {
        ctx = new AudioContext({ sampleRate: TTS_SAMPLE_RATE });
      }
      if (ctx.state === "suspended") await ctx.resume();

      // Reset scheduling position to "now" for this utterance.
      chatScheduledUntil = ctx.currentTime;

      try {
        const res = await fetch("/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) {
          log(`TTS HTTP error: ${res.status}`, "warn");
          return;
        }

        // ── Stream-decode and schedule each PCM chunk immediately ──────────
        // Each chunk is a variable number of Int16 samples.  We accumulate
        // bytes in a carry buffer because a chunk boundary may split a 2-byte
        // sample, then convert and hand to Web Audio as soon as we have enough.
        const reader    = res.body.getReader();
        let   carry     = new Uint8Array(0);  // leftover bytes from last read

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          if (!value || value.byteLength === 0) continue;

          // Prepend any carry bytes from the previous iteration
          let buf;
          if (carry.byteLength > 0) {
            buf = new Uint8Array(carry.byteLength + value.byteLength);
            buf.set(carry, 0);
            buf.set(value, carry.byteLength);
          } else {
            buf = value;
          }

          // Only consume an even number of bytes (Int16 = 2 bytes per sample)
          const usable = buf.byteLength - (buf.byteLength % 2);
          carry = buf.slice(usable);   // save odd byte (if any) for next chunk

          if (usable < 2) continue;

          const int16   = new Int16Array(buf.buffer, buf.byteOffset, usable / 2);
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

          const audioBuf = ctx.createBuffer(1, float32.length, TTS_SAMPLE_RATE);
          audioBuf.copyToChannel(float32, 0);

          // Schedule this chunk to play immediately after the previous one
          const startAt = Math.max(ctx.currentTime, chatScheduledUntil);
          const src = ctx.createBufferSource();
          src.buffer = audioBuf;
          src.connect(ctx.destination);
          src.start(startAt);
          chatScheduledUntil = startAt + audioBuf.duration;
        }

      } catch (err) {
        log(`speakText error: ${err.message}`, "error");
      }
    }

    // ── Chat: message helpers ────────────────────────────────────────────────

    function appendMessage(role, text) {
      // role: "user" | "assistant" | "error" | "system"
      const div = document.createElement("div");
      div.classList.add("msg", role);
      const prefix = role === "user"      ? "You: "
                   : role === "assistant" ? "Robo: "
                   : role === "error"     ? "Error: "
                   :                        "";
      div.textContent = prefix + text;
      chatHistoryEl.appendChild(div);
      chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
    }

    function setChatBusy(busy) {
      chatInputEl.disabled = busy;
      chatSendEl.disabled  = busy;
    }

    // ── Chat: send a message ─────────────────────────────────────────────────
    async function sendChat() {
      const text = chatInputEl.value.trim();
      if (!text) return;                        // ignore empty / whitespace

      chatInputEl.value = "";
      appendMessage("user", text);
      setChatBusy(true);

      try {
        const res = await fetch(`/chat/${KIOSK_ID}`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ message: text, session_uuid: sessionUuid }),
        });

        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          try { const j = await res.json(); detail = j.detail || detail; } catch {}
          appendMessage("error", detail);
          log(`Chat error: ${detail}`, "error");
        } else {
          const data = await res.json();
          appendMessage("assistant", data.response);
          log(`Chat response received (${data.response.length} chars)`);
          // Speak the response — if voice WS is connected the chat audio
          // plays through the same AudioContext; otherwise a fresh one is created.
          speakText(data.response);
        }
      } catch (err) {
        appendMessage("error", err.message || "Network error");
        log(`Chat fetch failed: ${err.message}`, "error");
      } finally {
        setChatBusy(false);
        chatInputEl.focus();
      }
    }

    chatSendEl.onclick = sendChat;
    chatInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !chatInputEl.disabled) sendChat();
    });

    // ── Session initialisation ───────────────────────────────────────────────
    // Must complete before the voice WebSocket is opened so both share the UUID.
    async function initSession() {
      try {
        const res = await fetch(`/chat/${KIOSK_ID}/session`, { method: "POST" });
        if (!res.ok) throw new Error(`Session init failed: HTTP ${res.status}`);
        const data = await res.json();
        sessionUuid = data.session_uuid;
        log(`✓ Session initialised: ${sessionUuid}`);

        // Enable the chat panel
        setChatBusy(false);
        appendMessage("system", "Chat ready. Type a message to begin.");

        // Open SSE stream for badge events
        openSSE();

        return true;
      } catch (err) {
        log(`✗ Session init error: ${err.message}`, "error");
        appendMessage("error", `Session init failed: ${err.message}. Refresh to retry.`);
        statusEl.textContent = "Session error — refresh to retry";
        return false;
      }
    }

    // ── SSE: badge events from Redis pub/sub ─────────────────────────────────
    function openSSE() {
      if (!sessionUuid) return;
      const url = `/chat/${KIOSK_ID}/events?session_uuid=${encodeURIComponent(sessionUuid)}`;
      eventSource = new EventSource(url);

      eventSource.onmessage = (e) => {
        let event;
        try { event = JSON.parse(e.data); } catch { return; }

        if (event.type === "ping") return;   // keepalive, ignore

        log(`SSE event: ${event.type}`, "debug");

        if (event.type === "checkin_complete") {
          setBadge("badge-checkin", true);
          log("Badge: checked in ✓");
        } else if (event.type === "notification_sent") {
          setBadge("badge-notified", true);
          log(`Badge: host notified — ${event.host_name}`);
        } else if (event.type === "host_acknowledged") {
          setBadge("badge-ack", true);
          const announceText = `${event.host_name} is on their way to meet you.`;
          responseEl.textContent = announceText;
          appendMessage("assistant", announceText);
          log("Badge: host acknowledged ✓");
          // Speak via HTTP TTS only when voice WS is not connected.
          // When voice is active, ws_handler redis_listener handles the audio.
          if (!connected) speakText(announceText);
        }
      };

      eventSource.onerror = () => {
        log("SSE connection lost — badge updates paused (auto-reconnecting…)", "warn");
      };

      log(`✓ SSE stream opened`);
    }

    // ── Badge helpers ────────────────────────────────────────────────────────
    function setBadge(id, active) {
      const el = document.getElementById(id);
      if (active) el.classList.add("active");
      else        el.classList.remove("active");
    }

    function resetBadges() {
      ["badge-checkin", "badge-notified", "badge-ack"].forEach(id =>
        document.getElementById(id).classList.remove("active")
      );
    }

    // ── Voice: connect / disconnect ──────────────────────────────────────────
    btnEl.onclick = async () => {
      if (connected) { disconnect(); return; }

      btnEl.disabled = true;
      btnEl.textContent = "Connecting…";
      try {
        await connect();
        connected = true;
        btnEl.disabled = false;
        btnEl.textContent = "Disconnect Voice";
        pttEl.style.display = "inline-block";
        setPttState("idle");
      } catch (err) {
        log(`Connection error: ${err.message}`, "error");
        statusEl.textContent = `Error: ${err.message}`;
        btnEl.disabled = false;
        btnEl.textContent = "Connect & Start Voice";
      }
    };

    pttEl.onclick = () => {
      if (!connected) return;
      if (pttState === "idle") {
        setPttState("recording");
        log("PTT: recording started");
      } else if (pttState === "recording") {
        setPttState("idle");
        log("PTT: recording cancelled");
      }
    };

    function setPttState(state) {
      pttState = state;
      pttEl.className = state;
      if (state === "idle") {
        pttEl.textContent = "🎤 Tap to Speak";
        pttEl.disabled = false;
      } else if (state === "recording") {
        pttEl.textContent = "🔴 Listening…  (tap to cancel)";
        pttEl.disabled = false;
      } else {
        pttEl.textContent = "⏳ Processing…";
        pttEl.disabled = true;
      }
    }

    function disconnect() {
      log("Disconnecting voice…");
      if (ws) ws.close();
      cleanup();
    }

    function cleanup() {
      connected = false;
      pttEl.style.display = "none";
      setPttState("idle");
      resetBadges();
      if (workletNode) { workletNode.disconnect(); workletNode = null; }
      if (audioCtx)    { audioCtx.close();         audioCtx    = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      playbackQueue = [];
      isPlaying = false;
      btnEl.disabled = false;
      btnEl.textContent = "Connect & Start Voice";
      statusEl.textContent = "Voice disconnected";
    }

    async function connect() {
      log("Starting voice connection…");
      resetBadges();

      // Audio context
      audioCtx = new AudioContext({ sampleRate: MIC_SAMPLE_RATE });
      if (audioCtx.state === "suspended") await audioCtx.resume();
      log(`✓ AudioContext (${audioCtx.sampleRate} Hz)`);

      // Microphone
      log("Requesting microphone…");
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: MIC_SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        log("✓ Microphone granted");
      } catch (err) {
        throw new Error(`Microphone denied: ${err.message}`);
      }

      const source = audioCtx.createMediaStreamSource(mediaStream);

      // AudioWorklet
      await audioCtx.audioWorklet.addModule("/static/worklet.js");
      workletNode = new AudioWorkletNode(audioCtx, "pcm-capture");
      source.connect(workletNode);
      log("✓ AudioWorklet ready");

      // WebSocket — include session_uuid so voice handler reuses the shared session
      const wsUrl = sessionUuid
        ? `ws://${window.location.host}/ws/voice/${KIOSK_ID}?session_uuid=${encodeURIComponent(sessionUuid)}`
        : `ws://${window.location.host}/ws/voice/${KIOSK_ID}`;

      log(`Connecting WS: ${wsUrl}`);
      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";

      let chunkCount = 0;
      workletNode.port.onmessage = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN && pttState === "recording") {
          ws.send(e.data);
          if (++chunkCount === 1) log(`First PCM chunk: ${e.data.byteLength} bytes`);
        }
      };

      ws.onmessage = async (event) => {
        if (typeof event.data === "string") {
          const msg = JSON.parse(event.data);
          log(`← ${msg.type}${msg.state ? ": " + msg.state : ""}`, "debug");
          handleControl(msg);
        } else {
          playbackQueue.push(event.data);
          if (!isPlaying) playNext();
        }
      };

      ws.onclose = () => { log("WebSocket closed"); cleanup(); };

      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error("WebSocket timeout (5s)")), 5000);
        ws.onopen = () => {
          clearTimeout(timeout);
          log("✓ WebSocket open");
          statusEl.textContent = "Voice connected — tap to speak";
          ws.onerror = (err) => { log(`WS error: ${err}`, "error"); };
          resolve();
        };
        ws.onerror = (err) => {
          clearTimeout(timeout);
          reject(new Error("WebSocket connection failed"));
        };
      });
    }

    // ── Voice: handle control messages from backend ──────────────────────────
    function handleControl(msg) {
      if (msg.type === "state") {
        statusEl.textContent = `Voice: ${msg.state}`;
        if (msg.state === "thinking" || msg.state === "speaking") {
          if (pttState === "recording") { setPttState("busy"); log("PTT → busy"); }
        } else if (msg.state === "idle") {
          if (pttState === "busy") { setPttState("idle"); log("PTT → idle"); }
        }
      } else if (msg.type === "transcript") {
        transcriptEl.textContent = `Transcript: ${msg.text}`;
        appendMessage("user", msg.text);
      } else if (msg.type === "response") {
        responseEl.textContent = `Response: ${msg.text}`;
        appendMessage("assistant", msg.text);
      } else if (msg.type === "ui_update") {
        // Voice WS still forwards badge events (for kiosks without SSE)
        if (msg.event === "checkin_complete") {
          setBadge("badge-checkin", true);
          log("Badge: checked in ✓");
        } else if (msg.event === "notification_sent") {
          setBadge("badge-notified", true);
          log(`Badge: host notified — ${msg.host_name}`);
        } else if (msg.event === "host_acknowledged") {
          setBadge("badge-ack", true);
          const announceText = `${msg.host_name} is on their way to meet you.`;
          responseEl.textContent = announceText;
          appendMessage("assistant", announceText);
          log("Badge: host acknowledged ✓");
        }
      } else if (msg.type === "audio_end") {
        log("Audio playback complete");
      }
    }

    // ── Voice: audio playback ────────────────────────────────────────────────
    async function playNext() {
      if (playbackQueue.length === 0) { isPlaying = false; return; }
      isPlaying = true;
      const arrayBuffer = playbackQueue.shift();
      const int16   = new Int16Array(arrayBuffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;
      const audioBuffer = audioCtx.createBuffer(1, float32.length, TTS_SAMPLE_RATE);
      audioBuffer.copyToChannel(float32, 0);
      const src = audioCtx.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(audioCtx.destination);
      src.onended = playNext;
      src.start();
    }

    // ── Bootstrap: initialise session on page load ───────────────────────────
    log("Page loaded — initialising session…");
    initSession();
  </script>
</body>
</html>
